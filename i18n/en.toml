descriptionText = """
A tool for generating Wonder Mail mission passwords for Pokémon Mystery Dungeon: Explorers of Time, Darkness and Sky. Supports all regions.

You can create virtually any type of mission.
"""
cautionTitle = "Caution"
cautionText = """
- Since this tool is based on EoS data, features exclusive to EoS cannot be used in T/D.
  Example: Oren Berry, Shaymin, Oblivion Forest etc.

- Depending on the mission you create, it may significantly affect game balance or even impact your save data.
"""
warningTitle = "Please read before use"
warningText = """
Passwords created with this tool are considered **hacked passwords** and **hacked missions**.

If you share these passwords on websites, social media, forums, or other platforms, please do so only in places where hacked passwords are permitted. Do not present or distribute them as if they were obtained through legitimate gameplay.

The author accepts no responsibility for any problems or damage resulting from the use of passwords generated by this tool. Use this tool at your own risk.
***
On the DS version only, certain mission configurations may cause the game to crash when the password is entered, potentially resulting in save data corruption. If you intend to use generated passwords on the DS version, always enable DS Mode.
"""
regionFreeText = "T/D passwords are region-free. No region selection is required."
descriptionDSMode = """
Restricts certain mission types to predefined templates only (enabled by default).
Disabling this option removes these restrictions and allows you to create missions freely. However, this also makes it possible to create missions that may crash the DS version of EoS. Please use this option with caution.
Note: This issue does not occur in non-DS versions of EoS.
"""
