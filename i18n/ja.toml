このツールで作成した依頼は「**捏造パス**」または「**改造パス**」と呼ばれるものとみなします。各種サイト・SNS・掲示板などへ掲載する際は、これらの依頼が掲載可能である場所のみで行ってください。

正規の手段で得られた依頼として偽って掲載することを禁止します。また、このツールによって発生した問題について一切の責任を負いません。自己責任でご利用ください。
***
